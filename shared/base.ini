; ============================================================
;  CONFIGURAÇÃO COMPARTILHADA POR TODOS OS PROJETOS DO LAB
; ============================================================
;
;  Cada projeto em projects/<nome>/ herda este arquivo com:
;
;      extra_configs = ../../shared/base.ini
;
;  Assim, se você trocar de placa ou de velocidade do monitor,
;  muda AQUI e vale para todos os projetos de uma vez.
;
;  Documentação: https://docs.platformio.org/en/latest/projectconf/

; ------------------------------------------------------------
;  ISOLAMENTO — o ponto central deste repositório
; ------------------------------------------------------------
;  Por padrão o PlatformIO instala compilador, framework e
;  bibliotecas em C:\Users\<voce>\.platformio, ou seja, FORA do
;  projeto e compartilhado com qualquer outro projeto da máquina.
;
;  A linha core_dir abaixo muda isso: tudo é baixado para
;  .pio-core/ na raiz DESTE repositório. Nada é instalado fora.
;  Apagar a pasta do repositório apaga o ambiente inteiro.
;
;  O caminho é relativo à pasta do projeto que está compilando
;  (projects/<nome>/), então ../../ aponta para a raiz do repo.
[platformio]
core_dir = ../../.pio-core

; ------------------------------------------------------------
;  DEFAULTS DE TODOS OS AMBIENTES
; ------------------------------------------------------------
;  A seção [env] é herdada por toda seção [env:alguma-coisa].
[env]

; A "platform" é o conjunto de ferramentas para a família do chip:
; compilador xtensa, gravador esptool, definições de placa.
;
; A versão está FIXADA de propósito: assim uma atualização futura
; do PlatformIO não muda o compilador por baixo dos panos e quebra
; projetos que funcionavam. Testado e validado nesta versão.
platform = espressif32@7.0.1

; A placa. esp32doit-devkit-v1 = ESP32 DevKit v1 / DOIT.
; Define memória, frequência e layout de flash.
;
; Conferido contra o chip real (esptool.py flash_id): ESP32-D0WD-V3
; revisão v3.1, módulo ESP32-WROOM-32E, 240 MHz dual core, 4 MB de
; flash, 320 KB de RAM. Bate exatamente com esta definição de placa.
board = esp32doit-devkit-v1

; O framework: a "linguagem" que usamos. arduino dá as funções
; simples (pinMode, digitalWrite, Serial.println).
framework = arduino

; Velocidade do Monitor Serial, em bauds. Precisa ser IGUAL ao
; número que o código passa em Serial.begin(). Se não bater, a
; saída aparece como lixo (Ã¾â–’Ã¿...).
monitor_speed = 115200

; Mostra nomes de função legíveis quando o ESP32 trava e imprime
; um "stack trace". Sem isso você só vê endereços de memória.
monitor_filters = esp32_exception_decoder, time

; Velocidade da gravação. 921600 é rápido e funciona na maioria
; das placas. Se der erro de upload, baixe para 115200.
upload_speed = 921600
