; ============================================================
;  PROJETO 05 — WEB SERVER & CLOUDFLARE TUNNEL
; ============================================================
;  Hospeda o site institucional 100% offline na Flash (LittleFS)
;  e permite acesso local ou público via Cloudflare Tunnel.
;
;  Particionamento: no_ota.csv
;  - 2 MB para firmware
;  - 1.92 MB para LittleFS (arquivos estáticos em data/)
; ============================================================

[platformio]
extra_configs = ../../shared/base.ini

[env:web-server]
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv

