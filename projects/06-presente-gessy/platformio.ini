; ============================================================
;  PROJETO 06 — PRESENTE DA GESSY: GALERIA 3D & CLOUDFLARE
; ============================================================
;  Galeria 3D interativa de memórias com Three.js servida
;  diretamente do LittleFS do ESP32 via Cloudflare Tunnel.
;
;  Particionamento customizado: partitions.csv
;  - 1.25 MB (1310720 bytes) para firmware
;  - 2.62 MB (2752512 bytes) para LittleFS (fotos, Three.js, áudio)
; ============================================================

[platformio]
extra_configs = ../../shared/base.ini

[env:presente-gessy]
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

