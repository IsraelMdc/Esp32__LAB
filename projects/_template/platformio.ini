; ============================================================
;  TEMPLATE — copie esta pasta para criar um projeto novo
; ============================================================
;
;  Como usar:
;    1. cd C:\Users\Public\esp32lab\projects
;    2. xcopy /E /I _template 05-meu-projeto
;    3. troque o nome do ambiente abaixo ([env:template])
;    4. adicione a pasta em Esp32__LAB.code-workspace
;
;  Herda placa, framework e isolamento de shared/base.ini.
[platformio]
extra_configs = ../../shared/base.ini

; Troque "template" por um nome curto do seu projeto.
; É o nome que você usa em:  ..\..\pio.cmd run -e template
[env:template]

; ------------------------------------------------------------
;  BIBLIOTECAS (descomente e ajuste conforme precisar)
; ------------------------------------------------------------
;  Procure o nome exato em https://registry.platformio.org
;  O ^ significa "esta versão ou uma mais nova compatível".
;  Elas são baixadas para dentro do repositório, só para ESTE projeto.
;
; lib_deps =
;     adafruit/DHT sensor library@^1.4.6
;     bblanchon/ArduinoJson@^7.0.4

; ------------------------------------------------------------
;  OUTRAS OPÇÕES ÚTEIS
; ------------------------------------------------------------
;  Fixar a porta COM (por padrão o PlatformIO detecta sozinho):
; upload_port = COM3
; monitor_port = COM3
;
;  Passar valores para o código como #define:
; build_flags =
;     -D DEBUG_MODE=1
